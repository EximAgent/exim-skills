# =============================================================================
# Model Configuration — Trade Company Agent Skills
# =============================================================================
# Format: provider/model-name
#
# Supported providers:
#   openai     — OpenAI API (also works with any OpenAI-compatible endpoint)
#   anthropic  — Anthropic API
#   gemini     — Google Gemini API
#
# Each entry maps a friendly config key to a provider/model + generation params.
# Switch models by changing the config key in .env (e.g., GEMINI_MODEL_CONFIG=gemini-2.5-pro)
#
# Custom OpenAI-compatible endpoints (e.g., Ollama, LiteLLM, OpenRouter):
#   Set api_base_url and api_key_env in generation_config.
# =============================================================================

# -- Gemini models (used for website finder LLM) --
gemini-3-flash-preview:
  model: gemini/gemini-3-flash-preview

gemini-3.1-flash-lite-preview:
  model: gemini/gemini-3.1-flash-lite-preview

gemini-3.1-pro-preview:
  model: gemini/gemini-3.1-pro-preview

# -- Embedding models --

gemini-embedding-001:
  model: gemini/gemini-embedding-001
  generation_config:
    embedding_dim: 3072

gemini-embedding-2-preview:
  model: gemini/gemini-embedding-2-preview
  generation_config:
    embedding_dim: 3072

openai-text-embedding-3-small:
  model: openai/text-embedding-3-small
  generation_config:
    embedding_dim: 1536

